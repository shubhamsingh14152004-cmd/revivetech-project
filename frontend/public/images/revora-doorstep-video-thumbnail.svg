  <rect x="650" y="387" width="25" height="42" rx="5" fill="#25352f" transform="rotate(-12 650 387)"/>
  <rect x="655" y="392" width="15" height="30" rx="2" fill="#cbe4d6" transform="rotate(-12 655 392)"/>
  <path d="M617 407q21-16 44-4M671 415q19-11 35-7" fill="none" stroke="#edc1a2" stroke-width="13" stroke-linecap="round"/>
  <rect x="458" y="626" width="364" height="42" rx="21" fill="#0f795c"/>
  <text x="640" y="654" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="1.5">DOORSTEP PHONE HANDOFF</text>
